<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coffee Invite ☕</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Outfit:wght@300;500;700&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #05030a url('starry-bg.jpg') center/cover no-repeat fixed;
    font-family: 'Outfit', sans-serif;
    overflow: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 30%, rgba(5, 3, 10, 0.55) 100%);
    z-index: 0;
    pointer-events: none;
  }

  .stars-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 1;
  }
  .star {
    position: absolute;
    background: white;
    border-radius: 50%;
    animation: twinkle var(--dur) ease-in-out infinite;
    box-shadow: 0 0 4px 1px rgba(255,255,255,0.6);
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.15; transform: scale(0.6); }
    50% { opacity: 0.9; transform: scale(1.3); }
  }

  .shooting-star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 0 8px 2px #fff;
    animation: shoot 5s linear infinite;
    opacity: 0;
    z-index: 1;
  }
  .shooting-star::after {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 100px;
    height: 1px;
    background: linear-gradient(90deg, #fff, transparent);
    transform: translateX(-100px);
  }
  @keyframes shoot {
    0% { transform: translate(0,0); opacity: 0; }
    4% { opacity: 1; }
    12% { opacity: 0; }
    100% { transform: translate(-500px, 300px); opacity: 0; }
  }

  .card {
    background: rgba(12, 8, 22, 0.62);
    border-radius: 32px;
    padding: 48px 44px 42px;
    text-align: center;
    max-width: 540px;
    width: 91%;
    box-shadow: 0 40px 80px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.07), inset 0 1px 0 rgba(255,255,255,0.08);
    position: relative;
    z-index: 2;
    backdrop-filter: blur(18px) saturate(1.4);
    border: 1px solid rgba(255, 220, 160, 0.08);
    animation: cardIn 1s cubic-bezier(0.22, 1, 0.36, 1);
  }

  @keyframes cardIn {
    0% { transform: scale(0.94) translateY(40px); opacity: 0; }
    100% { transform: scale(1) translateY(0); opacity: 1; }
  }

  .cup-img {
    width: 140px;
    height: auto;
    margin: 0 auto 12px;
    display: block;
    filter: drop-shadow(0 8px 24px rgba(232, 195, 106, 0.45));
    animation: floatCup 4s ease-in-out infinite;
  }
  @keyframes floatCup {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.75rem, 5.2vw, 2.55rem);
    color: #f7f1e8;
    line-height: 1.18;
    margin-bottom: 14px;
    font-weight: 600;
    letter-spacing: -0.3px;
    text-shadow: 0 2px 30px rgba(232, 195, 106, 0.25);
  }

  .subtitle {
    color: #d4c4e0;
    font-size: 1.08rem;
    margin-bottom: 34px;
    font-weight: 300;
    letter-spacing: 0.4px;
  }

  .btn-row {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 8px;
    position: relative;
    min-height: 72px;
  }

  button {
    font-family: 'Outfit', sans-serif;
    font-weight: 700;
    font-size: 1.22rem;
    padding: 16px 42px;
    border: none;
    border-radius: 100px;
    cursor: pointer;
    transition: all 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    letter-spacing: 0.5px;
    user-select: none;
  }

  #yesBtn {
    background: linear-gradient(180deg, #f0d78c 0%, #d4a54a 100%);
    color: #1a1208;
    box-shadow: 0 8px 0 #9a7430, 0 14px 32px rgba(212, 165, 74, 0.4);
  }
  #yesBtn:hover {
    transform: translateY(-3px);
    box-shadow: 0 11px 0 #9a7430, 0 18px 40px rgba(212, 165, 74, 0.5);
  }
  #yesBtn:active {
    transform: translateY(4px);
    box-shadow: 0 4px 0 #9a7430, 0 8px 20px rgba(212, 165, 74, 0.3);
  }

  #noBtn {
    background: linear-gradient(180deg, #4a2d6a 0%, #2d1a45 100%);
    color: #f4eef8;
    box-shadow: 0 8px 0 #1e102c, 0 14px 30px rgba(74, 45, 106, 0.45);
    position: fixed;
    z-index: 100;
    border: 1px solid rgba(255,255,255,0.12);
  }
  #noBtn:hover { transform: scale(1.03); }

  .message {
    display: none;
    margin-top: 28px;
    font-size: 1.4rem;
    font-weight: 500;
    color: #f0d78c;
    animation: popIn 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
    text-shadow: 0 0 24px rgba(240, 215, 140, 0.45);
    font-family: 'Playfair Display', serif;
    font-style: italic;
  }
  .message.show { display: block; }

  @keyframes popIn {
    0% { transform: scale(0.7); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  .float-emoji {
    position: fixed;
    pointer-events: none;
    font-size: 30px;
    animation: riseUp 2.6s ease-out forwards;
    z-index: 50;
  }
  @keyframes riseUp {
    0% { transform: translateY(0) scale(1) rotate(0deg); opacity: 1; }
    100% { transform: translateY(-340px) scale(0.35) rotate(20deg); opacity: 0; }
  }

  .hint {
    margin-top: 18px;
    font-size: 0.92rem;
    color: #b8a8c8;
    font-style: italic;
    font-family: 'Playfair Display', serif;
  }
</style>
</head>
<body>
  <div class="stars-layer" id="stars"></div>
  <div class="shooting-star" style="top:12%; left:75%; animation-delay:0.5s;"></div>
  <div class="shooting-star" style="top:28%; left:55%; animation-delay:2.8s;"></div>
  <div class="shooting-star" style="top:8%; left:35%; animation-delay:5.2s;"></div>
  <div class="shooting-star" style="top:22%; left:85%; animation-delay:7.5s;"></div>

  <div class="card">
    <img src="coffee-cup.png" alt="Coffee" class="cup-img">
    <h1>Can I invite you<br>to a cup of coffee?</h1>
    <p class="subtitle">Under a sky full of stars</p>

    <div class="btn-row">
      <button id="yesBtn">Yes ✨</button>
      <button id="noBtn">No</button>
    </div>

    <div class="message" id="message">
      Perfect. See you under the stars ✨
    </div>
    <p class="hint" id="hint">the night is long… try saying no</p>
  </div>

<script>
const noBtn = document.getElementById('noBtn');
const yesBtn = document.getElementById('yesBtn');
const message = document.getElementById('message');
const hint = document.getElementById('hint');
const starsContainer = document.getElementById('stars');

for (let i = 0; i < 80; i++) {
  const star = document.createElement('div');
  star.className = 'star';
  const size = Math.random() * 2.4 + 0.5;
  star.style.width = size + 'px';
  star.style.height = size + 'px';
  star.style.left = Math.random() * 100 + '%';
  star.style.top = Math.random() * 100 + '%';
  star.style.setProperty('--dur', (Math.random() * 3.5 + 1.8) + 's');
  star.style.animationDelay = (Math.random() * 5) + 's';
  starsContainer.appendChild(star);
}

let moving = false;
let audioCtx = null;

function unlockAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
document.addEventListener('pointerdown', unlockAudio, { once: true });
document.addEventListener('keydown', unlockAudio, { once: true });

function playFleeSound() {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(360, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.22);
  gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.24);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.24);
}

function playYesSound() {
  if (!audioCtx) return;
  const notes = [392, 494, 587, 784];
  notes.forEach((freq, i) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.value = freq;
    const start = audioCtx.currentTime + i * 0.11;
    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.exponentialRampToValueAtTime(0.18, start + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.42);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(start);
    osc.stop(start + 0.46);
  });
}

function placeNoButton(random = false) {
  const w = noBtn.offsetWidth || 140;
  const h = noBtn.offsetHeight || 54;
  const pad = 16;
  let x, y;
  if (random) {
    x = pad + Math.random() * (window.innerWidth - w - pad * 2);
    y = pad + Math.random() * (window.innerHeight - h - pad * 2);
  } else {
    const yesRect = yesBtn.getBoundingClientRect();
    x = yesRect.right + 22;
    y = yesRect.top;
    x = Math.min(x, window.innerWidth - w - pad);
    y = Math.max(pad, Math.min(y, window.innerHeight - h - pad));
  }
  noBtn.style.left = x + 'px';
  noBtn.style.top = y + 'px';
}

function flee() {
  if (moving) return;
  moving = true;
  playFleeSound();
  placeNoButton(true);
  noBtn.style.transform = 'scale(0.88)';
  setTimeout(() => { noBtn.style.transform = 'scale(1)'; }, 60);
  setTimeout(() => moving = false, 100);
}

window.addEventListener('load', () => placeNoButton(false));
window.addEventListener('resize', () => {
  if (!message.classList.contains('show')) placeNoButton(false);
});

noBtn.addEventListener('mouseenter', flee);
noBtn.addEventListener('mousemove', (e) => {
  const r = noBtn.getBoundingClientRect();
  const cx = r.left + r.width / 2;
  const cy = r.top + r.height / 2;
  if (Math.hypot(e.clientX - cx, e.clientY - cy) < 68) flee();
});

noBtn.addEventListener('touchstart', (e) => {
  e.preventDefault();
  flee();
}, { passive: false });

yesBtn.addEventListener('click', () => {
  playYesSound();
  message.classList.add('show');
  hint.style.display = 'none';
  noBtn.style.display = 'none';
  yesBtn.style.transform = 'scale(1.07)';
  yesBtn.style.boxShadow = '0 8px 0 #9a7430, 0 0 50px rgba(240, 215, 140, 0.65)';

  const emojis = ['☕', '✨', '⭐', '💫', '🌙'];
  for (let i = 0; i < 15; i++) {
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'float-emoji';
      el.textContent = emojis[i % emojis.length];
      el.style.left = (10 + Math.random() * 80) + '%';
      el.style.bottom = '20%';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 2600);
    }, i * 75);
  }
});
</script>
</body>
</html>
