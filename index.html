<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coffee Invite ☕</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Outfit:wght@400;600;800&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ff6b35;
    background-image: 
      radial-gradient(circle at 15% 20%, #ffd93d 0%, transparent 40%),
      radial-gradient(circle at 85% 75%, #ff2e63 0%, transparent 45%),
      radial-gradient(circle at 50% 50%, #6a0572 0%, transparent 60%),
      linear-gradient(135deg, #ff6b35 0%, #ff2e63 50%, #6a0572 100%);
    font-family: 'Outfit', sans-serif;
    overflow: hidden;
    position: relative;
  }

  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(40px);
    opacity: 0.5;
    pointer-events: none;
    animation: blobFloat 8s ease-in-out infinite;
  }
  .blob:nth-child(1) { width: 300px; height: 300px; background: #ffd93d; top: -50px; left: -50px; animation-delay: 0s; }
  .blob:nth-child(2) { width: 250px; height: 250px; background: #00d9ff; bottom: -40px; right: -40px; animation-delay: -3s; }
  .blob:nth-child(3) { width: 200px; height: 200px; background: #ff2e63; top: 40%; left: 70%; animation-delay: -5s; }

  @keyframes blobFloat {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(30px, -40px) scale(1.1); }
    66% { transform: translate(-20px, 30px) scale(0.9); }
  }

  .card {
    background: rgba(255, 255, 255, 0.94);
    border-radius: 32px;
    padding: 40px 36px 36px;
    text-align: center;
    max-width: 500px;
    width: 92%;
    box-shadow: 
      0 25px 50px rgba(0,0,0,0.25),
      0 0 0 4px rgba(255,255,255,0.4),
      0 0 80px rgba(255, 107, 53, 0.3);
    position: relative;
    z-index: 2;
    backdrop-filter: blur(12px);
    animation: cardIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes cardIn {
    0% { transform: scale(0.8) translateY(40px); opacity: 0; }
    100% { transform: scale(1) translateY(0); opacity: 1; }
  }

  .cup-wrap {
    position: relative;
    display: inline-block;
    margin-bottom: 4px;
  }
  .cup {
    font-size: 80px;
    display: block;
    filter: drop-shadow(0 6px 12px rgba(255, 107, 53, 0.4));
    animation: bounce 2s ease-in-out infinite;
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  .steam {
    position: absolute;
    top: -10px;
    left: 50%;
    width: 8px;
    height: 20px;
    background: rgba(255,255,255,0.7);
    border-radius: 10px;
    animation: steamRise 2s ease-out infinite;
    opacity: 0;
  }
  .steam:nth-child(2) { left: 40%; animation-delay: 0.4s; }
  .steam:nth-child(3) { left: 60%; animation-delay: 0.8s; }
  @keyframes steamRise {
    0% { transform: translateX(-50%) translateY(0) scale(1); opacity: 0.6; }
    100% { transform: translateX(-50%) translateY(-40px) scale(1.5); opacity: 0; }
  }

  h1 {
    font-family: 'Fredoka', sans-serif;
    font-size: clamp(1.8rem, 5.5vw, 2.6rem);
    background: linear-gradient(90deg, #ff6b35, #ff2e63, #6a0572);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.15;
    margin-bottom: 10px;
    font-weight: 700;
  }

  .subtitle {
    color: #5a4a4a;
    font-size: 1.1rem;
    margin-bottom: 28px;
    font-weight: 600;
  }

  .btn-row {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin-top: 8px;
    position: relative;
    min-height: 68px;
  }

  button {
    font-family: 'Fredoka', sans-serif;
    font-weight: 700;
    font-size: 1.3rem;
    padding: 16px 36px;
    border: none;
    border-radius: 100px;
    cursor: pointer;
    transition: all 0.15s ease;
    letter-spacing: 0.3px;
    user-select: none;
  }

  #yesBtn {
    background: linear-gradient(180deg, #00d9a5 0%, #00b386 100%);
    color: white;
    box-shadow: 0 8px 0 #008f6b, 0 12px 30px rgba(0, 217, 165, 0.45);
  }
  #yesBtn:hover {
    transform: translateY(-3px) scale(1.03);
    box-shadow: 0 11px 0 #008f6b, 0 18px 36px rgba(0, 217, 165, 0.55);
  }
  #yesBtn:active {
    transform: translateY(4px) scale(0.98);
    box-shadow: 0 4px 0 #008f6b, 0 6px 16px rgba(0, 217, 165, 0.35);
  }

  #noBtn {
    background: linear-gradient(180deg, #ff4d6d 0%, #e63950 100%);
    color: white;
    box-shadow: 0 8px 0 #c1121f, 0 12px 28px rgba(255, 77, 109, 0.4);
    position: fixed;
    z-index: 100;
  }
  #noBtn:hover {
    transform: scale(1.02);
  }

  .message {
    display: none;
    margin-top: 24px;
    font-size: 1.4rem;
    font-weight: 800;
    background: linear-gradient(90deg, #ff6b35, #ff2e63);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .message.show { display: block; }

  @keyframes popIn {
    0% { transform: scale(0.5); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  .float-emoji {
    position: fixed;
    pointer-events: none;
    font-size: 32px;
    animation: riseUp 2.4s ease-out forwards;
    z-index: 50;
  }
  @keyframes riseUp {
    0% { transform: translateY(0) scale(1) rotate(0deg); opacity: 1; }
    100% { transform: translateY(-320px) scale(0.3) rotate(30deg); opacity: 0; }
  }

  .hint {
    margin-top: 18px;
    font-size: 0.95rem;
    color: #ff2e63;
    font-weight: 700;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.7; }
    50% { opacity: 1; }
  }

  .notified {
    display: none;
    margin-top: 12px;
    font-size: 0.85rem;
    color: #008f6b;
    font-weight: 600;
  }
  .notified.show { display: block; }
</style>
</head>
<body>
  <div class="blob"></div>
  <div class="blob"></div>
  <div class="blob"></div>

  <div class="card">
    <div class="cup-wrap">
      <span class="steam"></span>
      <span class="steam"></span>
      <span class="steam"></span>
      <span class="cup">☕</span>
    </div>
    <h1>Can I invite you<br>to a cup of coffee?</h1>
    <p class="subtitle">Just say yes — the button knows what’s up 😏</p>

    <div class="btn-row">
      <button id="yesBtn">Yes!! ☕</button>
      <button id="noBtn">No way</button>
    </div>

    <div class="message" id="message">
      Yesss! See you soon ✨☕
    </div>
    <p class="notified" id="notified">Notification sent ✨</p>
    <p class="hint" id="hint">the no button is shy… try it</p>
  </div>

<script>
const noBtn = document.getElementById('noBtn');
const yesBtn = document.getElementById('yesBtn');
const message = document.getElementById('message');
const hint = document.getElementById('hint');
const notified = document.getElementById('notified');

let moving = false;
let audioCtx = null;

function unlockAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
document.addEventListener('pointerdown', unlockAudio, { once: true });
document.addEventListener('keydown', unlockAudio, { once: true });

function playFleeSound() {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(420, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(180, audioCtx.currentTime + 0.18);
  gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.2);
}

function playYesSound() {
  if (!audioCtx) return;
  const notes = [523, 659, 784, 1046];
  notes.forEach((freq, i) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.value = freq;
    const start = audioCtx.currentTime + i * 0.09;
    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.exponentialRampToValueAtTime(0.22, start + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.35);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(start);
    osc.stop(start + 0.4);
  });
}

function placeNoButton(random = false) {
  const w = noBtn.offsetWidth || 150;
  const h = noBtn.offsetHeight || 54;
  const pad = 12;
  let x, y;

  if (random) {
    x = pad + Math.random() * (window.innerWidth - w - pad * 2);
    y = pad + Math.random() * (window.innerHeight - h - pad * 2);
  } else {
    const yesRect = yesBtn.getBoundingClientRect();
    x = yesRect.right + 18;
    y = yesRect.top;
    x = Math.min(x, window.innerWidth - w - pad);
    y = Math.max(pad, Math.min(y, window.innerHeight - h - pad));
  }

  noBtn.style.left = x + 'px';
  noBtn.style.top = y + 'px';
}

function flee() {
  if (moving) return;
  moving = true;
  playFleeSound();
  placeNoButton(true);
  noBtn.style.transform = 'scale(0.92)';
  setTimeout(() => { noBtn.style.transform = 'scale(1)'; }, 80);
  setTimeout(() => moving = false, 100);
}

window.addEventListener('load', () => placeNoButton(false));
window.addEventListener('resize', () => {
  if (!message.classList.contains('show')) placeNoButton(false);
});

noBtn.addEventListener('mouseenter', flee);
noBtn.addEventListener('mousemove', (e) => {
  const r = noBtn.getBoundingClientRect();
  const cx = r.left + r.width / 2;
  const cy = r.top + r.height / 2;
  if (Math.hypot(e.clientX - cx, e.clientY - cy) < 75) flee();
});

noBtn.addEventListener('touchstart', (e) => {
  e.preventDefault();
  flee();
}, { passive: false });

yesBtn.addEventListener('click', async () => {
  playYesSound();
  message.classList.add('show');
  hint.style.display = 'none';
  noBtn.style.display = 'none';
  yesBtn.style.transform = 'scale(1.1)';
  yesBtn.style.boxShadow = '0 8px 0 #008f6b, 0 0 50px rgba(0, 217, 165, 0.7)';

  const emojis = ['☕', '💖', '✨', '🔥', '☕', '💫', '🥐'];
  for (let i = 0; i < 18; i++) {
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'float-emoji';
      el.textContent = emojis[i % emojis.length];
      el.style.left = (10 + Math.random() * 80) + '%';
      el.style.bottom = '20%';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 2400);
    }, i * 60);
  }

  // Notify via FormSubmit (email)
  try {
    const res = await fetch('https://formsubmit.co/ajax/shehabfarag120@gmail.com', {
      method: 'POST',
      headers: { 
        'Content-Type': 'application/json',
        'Accept': 'application/json'
      },
      body: JSON.stringify({
        message: 'She said YES to coffee! ☕',
        time: new Date().toISOString(),
        page: window.location.href,
        _subject: 'Coffee Invite: YES! ☕',
        _template: 'table'
      })
    });
    if (res.ok) {
      notified.classList.add('show');
    }
  } catch (err) {
    console.log('Notification failed (check email activation)', err);
  }
});
</script>
</body>
</html>
